# One config for every playbook. Relative paths below resolve against this
# file's directory, so it works from anywhere:
# - locally: cd ansible && ansible-playbook playbooks/docker.yaml
# - Semaphore (runs from the repo root): set ANSIBLE_CONFIG=ansible/ansible.cfg
#   in the project's environment. Without it, playbooks still work, just
#   without pipelining and the YAML output.
[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
