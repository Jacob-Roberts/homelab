---
# Manual smoke test for the default `nfs` StorageClass (TrueNAS CSI driver).
# Apply, confirm the PVC binds and the pod writes to it, then delete. The ZFS
# dataset is retained because the class uses reclaimPolicy: Retain, so remove
# bulk-slow/encrypted/k8s/nfs-test on the appliance afterwards.
# Not managed by Flux (kubernetes/test is excluded in .sourceignore).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-test
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-test
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: docker.io/library/busybox:1.36
      command:
        - sh
        - -c
        - "echo hello-from-k8s > /data/hello.txt && cat /data/hello.txt"
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-test
