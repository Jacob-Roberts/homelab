---
# =============================================================================
# geerlingguy.security role (playbooks/security.yaml)
# =============================================================================
# sshd only accepts admin_users (group_vars/all.yaml). The automation user
# must be in that list, or the next run cannot connect.
security_ssh_allowed_users: "{{ admin_users | map(attribute='name') | list }}"
security_sudoers_passwordless: "{{ admin_users | map(attribute='name') | list }}"
security_sudoers_passworded: []

security_ssh_password_authentication: "no"
security_ssh_permit_root_login: "no"
security_ssh_usedns: "no"
security_ssh_permit_empty_password: "no"
security_ssh_challenge_response_auth: "no"
security_ssh_gss_api_authentication: "no"
security_ssh_x11_forwarding: "no"
security_sshd_state: started
security_ssh_restart_handler_state: restarted

security_autoupdate_enabled: true
security_autoupdate_blacklist: []
security_autoupdate_additional_origins: []
# LUKS-encrypted hosts need a passphrase at boot; never reboot on our own.
security_autoupdate_reboot: false
security_autoupdate_mail_to: "jroberts.glql8@simplelogin.com"
security_autoupdate_mail_on_error: true

security_fail2ban_enabled: true
