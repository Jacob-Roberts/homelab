---
name: doco-cd

services:
  doco-cd:
    # Pin by tag + digest and let Renovate open the bump PR.
    # A moving tag like "latest" turns every restart into an unreviewed upgrade.
    image: ghcr.io/kimdre/doco-cd:0.133.2@sha256:8ca3cf6701f70ac3af4c5d726e542fe3a854a038149375f87222ec2719b3c975
    restart: unless-stopped

    # No container_name or host ports lets auto use scale_out for a
    # zero-downtime handover. If either is required, auto uses applier instead.
    # Reach the API through a reverse proxy on this network.

    depends_on:
      - dockerproxy
    cap_drop:
      - ALL

    environment:
      TZ: ${TZ}
      SELF_UPDATE_ENABLED: "true"
      SELF_UPDATE_STRATEGY: auto
      POLL_CONFIG: |
        - url: https://github.com/Jacob-Roberts/homelab.git
          reference: main
          interval: 300
      DEPLOY_CONFIG_BASE_DIR: ${DEPLOY_CONFIG_BASE_DIR}
      DOCKER_HOST: tcp://dockerproxy:2375
      SECRET_PROVIDER: infisical
      SECRET_PROVIDER_SITE_URL: https://app.infisical.com
      SECRET_PROVIDER_CLIENT_ID: ${SECRET_PROVIDER_CLIENT_ID}
      SECRET_PROVIDER_CLIENT_SECRET_FILE: /run/secrets/infisical_client_secret
      # Private repository: uncomment these two lines, the "secrets" lines below
      # and the top-level "secrets" block. See the Getting Started guide.
      # GIT_AUTH_DOMAINS lists the hosts that receive the token.
      # GIT_ACCESS_TOKEN_FILE: /run/secrets/git_access_token
      # GIT_AUTH_DOMAINS: "- domains: [github.com]"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - data:/data

    # The health gate decides whether the new version is kept. Without a
    # healthcheck doco-cd falls back to running `doco-cd healthcheck` inside
    # the new container, which is slower and less precise.
    healthcheck: # runs the image's built-in /healthcheck command
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

    secrets:
      - infisical_client_secret
    #   - git_access_token

  dockerproxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Required by every installation
      PING: 1
      VERSION: 1
      INFO: 1
      EVENTS: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      DISTRIBUTION: 1
      # Required to deploy anything
      POST: 1
      DELETE: 1
      # Endpoints doco-cd never uses
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      PLUGINS: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      # mount host docker socket, the :ro does not mean read-only for the socket, just for the actual file
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:

# Path of the token file.
secrets:
  infisical_client_secret:
    file: /opt/doco-cd/infisical_client_secret
  # git_access_token:
  #   file: /opt/doco-cd/git-access-token
