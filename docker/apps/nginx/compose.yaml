---

networks:
  frontend:
    # Contains all the services that will be routed to
    external: true

services:
  app:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    container_name: nginx-prod-1
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    labels:
      traefik.enable: "true"
      traefik.http.routers.nginx-prod-1-http.entrypoints: web
      traefik.http.routers.nginx-prod-1-http.rule: Host(`${NGINX_HOST}`)
      traefik.http.routers.nginx-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.nginx-prod-1-https.entrypoints: websecure
      traefik.http.routers.nginx-prod-1-https.rule: Host(`${NGINX_HOST}`)
      traefik.http.routers.nginx-prod-1-https.tls: "true"
      traefik.http.routers.nginx-prod-1-https.tls.certresolver: cloudflare
