apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pocket-id-secrets
  namespace: pocket-id
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        # Populate this path in Infisical with an ENCRYPTION_KEY entry
        # (openssl rand -base64 32). It is exposed to the container as the
        # ENCRYPTION_KEY env var via envFrom below.
        projectId: f3732b81-3a85-430d-a547-43b85c363ad6
        envSlug: prod
        secretsPath: /pbj/pocket-id
        recursive: true
  managedSecretReference:
    secretName: pocket-id-secrets
    secretNamespace: pocket-id
    creationPolicy: Owner
