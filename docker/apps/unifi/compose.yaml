---
name: unifi

networks:
  frontend:
    external: false
  internal:
    external: false

volumes:
  config:
  data:

services:
  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:10.0.162-ls112@sha256:268340299e6a8a85c29800923e242c60ed7baa24557943f0ff5ec4ea52804232
    container_name: unifi-network-application
    restart: unless-stopped
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp #optional
      - 8843:8843 #optional
      - 8880:8880 #optional
      - 6789:6789 #optional
      - 5514:5514/udp #optional
    environment:
      PUID: "${DOCKER_USER_ID:-2016}"
      PGID: "${DOCKER_GROUP_ID:-2016}"
      TZ: Etc/UTC
      MONGO_USER: unifi
      MONGO_PASS: "${MONGO_PASS}"
      MONGO_HOST: unifi-db
      MONGO_PORT: '27017'
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
      MEM_LIMIT: 1024 #optional
      MEM_STARTUP: 1024 #optional
    networks:
      - frontend
      - internal
    volumes:
      - config:/config
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.docker.network: unifi_frontend
      traefik.http.routers.unifi-prod-1-http.entrypoints: web
      traefik.http.routers.unifi-prod-1-http.rule: Host(`${UNIFI_URL}`)
      traefik.http.routers.unifi-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.unifi-prod-1-https.entrypoints: websecure
      traefik.http.routers.unifi-prod-1-https.rule: Host(`${UNIFI_URL}`)
      traefik.http.routers.unifi-prod-1-https.tls: "true"
      traefik.http.routers.unifi-prod-1-https.tls.certresolver: cloudflare
      traefik.http.services.unifi-prod-1.loadbalancer.server.port: 8443
      traefik.http.services.unifi-prod-1.loadbalancer.serverstransport: "ignorecert@file"
      traefik.http.services.unifi-prod-1.loadbalancer.server.scheme: https

  unifi-db:
    image: docker.io/mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    container_name: unifi-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASS}"
      MONGO_USER: unifi
      MONGO_PASS: "${MONGO_PASS}"
      MONGO_DBNAME: unifi
      MONGO_AUTHSOURCE: admin
    networks:
      - internal
    volumes:
      - data:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
