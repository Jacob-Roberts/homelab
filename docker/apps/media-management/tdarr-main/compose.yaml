---
name: tdarr-main

networks:
  frontend:
    external: false

volumes:
  tdarr-config-server:
  tdarr-config-config:
  tdarr-config-logs:

services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - 8266:8266 # server port
    environment:
      TZ: ${TZ:-UTC}
      PUID: "${PUID:-2003}"
      PGID: "${PGID:-2003}"
      UMASK_SET: '002'
      serverIP: 0.0.0.0
      serverPort: '8266'
      webUIPort: '8265'
      internalNode: "true"
      inContainer: "true"
      ffmpegVersion: '7'
      nodeName: pbj-node-1
      auth: "false"
      openBrowser: "true"
      maxLogSizeMB: '10'
      cronPluginUpdate: ""
      NVIDIA_DRIVER_CAPABILITIES: all
      NVIDIA_VISIBLE_DEVICES: all
    networks:
      - frontend
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - tdarr-config-server:/app/server
      - tdarr-config-config:/app/configs
      - tdarr-config-logs:/app/logs
      - ${JELLYDATA_HOST_PATH}/media:/media:rw
      - ${JELLYDATA_HOST_PATH}/transcode_cache:/tcache
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    labels:
      traefik.enable: "true"
      traefik.docker.network: media-management_frontend
      traefik.http.services.tdarr-prod-1.loadBalancer.server.port: 8265
      traefik.http.routers.tdarr-prod-1-http.entrypoints: web
      traefik.http.routers.tdarr-prod-1-http.rule: Host(`${TDARR_URL:-tdarr.pbj.jakerob.pro}`)
      traefik.http.routers.tdarr-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.tdarr-prod-1-https.entrypoints: websecure
      traefik.http.routers.tdarr-prod-1-https.rule: Host(`${TDARR_URL:-tdarr.pbj.jakerob.pro}`)
      traefik.http.routers.tdarr-prod-1-https.tls: "true"
      traefik.http.routers.tdarr-prod-1-https.tls.certresolver: cloudflare
