---
name: webnut

networks:
  frontend:
    external: true

services:
  nut:
    image: docker.io/edgd1er/webnut:latest@sha256:bb41f38d03c7129b720c4a2549dcc2ccd12918993bfca313a1551284d0a5b22b
    container_name: webnut
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      UPS_HOST: "${UPS_HOST}"
      UPS_PORT: "${UPS_PORT}"
      UPS_USER: "${UPS_USER}"
      UPS_PASSWORD: "${UPS_PASSWORD}"
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.http.services.webnut-prod-1.loadBalancer.server.port: 6543
      traefik.http.routers.webnut-prod-1-http.entrypoints: web
      traefik.http.routers.webnut-prod-1-http.rule: Host(`${WEBNUT_URL}`)
      traefik.http.routers.webnut-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.webnut-prod-1-https.entrypoints: websecure
      traefik.http.routers.webnut-prod-1-https.rule: Host(`${WEBNUT_URL}`)
      traefik.http.routers.webnut-prod-1-https.tls: "true"
      traefik.http.routers.webnut-prod-1-https.tls.certresolver: cloudflare
