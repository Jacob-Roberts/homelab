---
# =============================================================================
# NFS mounts
# =============================================================================
# Run: ansible-playbook playbooks/nfs-mounts.yaml [-l <host>]
#
# Mounts the TrueNAS shares listed in each host's `nfs_mounts` (host_vars).
# Entries take `path` and `src`, plus optional `opts` and `state`
# (default: mounted; use `absent` to unmount and remove from fstab).
# =============================================================================

- name: NFS mounts
  hosts: docker
  become: true

  vars:
    nfs_default_opts: rw,noatime,hard,_netdev,timeo=900,retrans=5

  tasks:
    - name: Install NFS client
      ansible.builtin.apt:
        name: nfs-common
        state: present
      when: nfs_mounts | default([]) | length > 0

    - name: Mount NFS shares
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: nfs
        opts: "{{ item.opts | default(nfs_default_opts) }}"
        state: "{{ item.state | default('mounted') }}"
      loop: "{{ nfs_mounts | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
