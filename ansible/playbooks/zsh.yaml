---
# =============================================================================
# zsh + dotfiles for the human admin
# =============================================================================
# Run: ansible-playbook playbooks/zsh.yaml [-l <host>] [-e dotfiles_user=<name>]
#
# Sets up zsh, Oh My Zsh and the stowed dotfiles for `dotfiles_user`, not for
# the account ansible connects as (ansible-robot).
# =============================================================================

- name: Zsh and dotfiles
  hosts: hardened
  become: true

  vars:
    dotfiles_user: jacobroberts
    dotfiles_repo: https://github.com/Jacob-Roberts/dotfiles.git
    dotfiles_home: "/home/{{ dotfiles_user }}"

  tasks:
    - name: Install zsh, git and stow
      ansible.builtin.apt:
        name: [zsh, git, stow]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Make zsh the default shell
      ansible.builtin.user:
        name: "{{ dotfiles_user }}"
        shell: /usr/bin/zsh

    - name: Run as the dotfiles user
      become: true
      become_user: "{{ dotfiles_user }}"
      block:
        - name: Clone dotfiles # noqa: latest[git] track the dotfiles default branch
          ansible.builtin.git:
            repo: "{{ dotfiles_repo }}"
            dest: "{{ dotfiles_home }}/.dotfiles"
            version: HEAD
            update: true

        - name: Find dotfile packages
          ansible.builtin.find:
            paths: "{{ dotfiles_home }}/.dotfiles"
            recurse: false
            file_type: directory
            excludes: [".git"]
            hidden: false
          register: dotfile_packages

        - name: Stow dotfiles
          ansible.builtin.command:
            cmd: stow --target={{ dotfiles_home }} {{ item.path | basename }} --verbose=2
            chdir: "{{ dotfiles_home }}/.dotfiles"
          loop: "{{ dotfile_packages.files }}"
          loop_control:
            label: "{{ item.path | basename }}"
          register: stow_result
          changed_when: 'stow_result.stderr is search("LINK: ")'

        - name: Install Oh My Zsh
          ansible.builtin.git:
            repo: https://github.com/ohmyzsh/ohmyzsh.git
            dest: "{{ dotfiles_home }}/.oh-my-zsh"
            version: master
            depth: 1
            update: false

        - name: Install zsh-autosuggestions
          ansible.builtin.git:
            repo: https://github.com/zsh-users/zsh-autosuggestions.git
            dest: "{{ dotfiles_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
            version: master
            depth: 1
            update: true
