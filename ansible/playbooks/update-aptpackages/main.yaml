---
# Run: DISCORD_WEBHOOK_URL=... ansible-playbook playbooks/update-aptpackages/main.yaml
# (path kept stable for scheduled Semaphore runs)
#
# Upgrades packages but never reboots (LUKS hosts need a passphrase at boot);
# posts to Discord when a reboot is pending. Docker upgrades restart dockerd;
# live-restore (group_vars/docker.yaml) keeps containers running through it.
- name: Update all APT packages
  hosts: updatable_apt
  become: true

  vars:
    discord_webhook_url: "{{ lookup('ansible.builtin.env', 'DISCORD_WEBHOOK_URL') }}"

  tasks:
    - name: Upgrade apt packages
      ansible.builtin.apt:
        upgrade: safe
        update_cache: true

    - name: Check whether a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Send Discord alert
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          content: "Reboot required on {{ inventory_hostname }}"
        status_code: 204
      when:
        - reboot_required.stat.exists
        - discord_webhook_url | length > 0
