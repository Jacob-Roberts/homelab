---
name: immich

networks:
  frontend:
    external: false
  internal:
    external: false

volumes:
  model-cache:
  database:
  redis-data:

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b
    container_name: immich_server
    user: "${DOCKER_USER_ID:-2004}:${DOCKER_GROUP_ID:-2004}"
    security_opt:
      # Prevent escalation of privileges after the container is started
      - no-new-privileges:true
    cap_drop:
      # Prevent access to raw network traffic
      - NET_RAW
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    logging:
      driver: local
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_HOSTNAME: database
      DB_DATABASE_NAME: "${DB_DATABASE_NAME:-immich}"
      IMMICH_ALLOW_SETUP: "false"
    networks:
      - frontend
      - internal
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - /media/immich:/data
      - /etc/localtime:/etc/localtime:ro
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
    labels:
      traefik.enable: "true"
      traefik.external: "true"
      traefik.docker.network: immich_frontend
      traefik.http.routers.immich-prod-1-http.entrypoints: web
      traefik.http.routers.immich-prod-1-http.rule: Host(`${APP_URL}`)
      traefik.http.routers.immich-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.immich-prod-1-https.entrypoints: websecure
      traefik.http.routers.immich-prod-1-https.rule: Host(`${APP_URL}`)
      traefik.http.routers.immich-prod-1-https.tls: "true"
      traefik.http.routers.immich-prod-1-https.tls.certresolver: cloudflare

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.1@sha256:8adebf414256f6e4f837bfbb66fa94f14f4da7260e3a1d65cbba49e4e35d8764
        # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
        #   file: hwaccel.ml.yml
        #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    container_name: immich_machine_learning
        # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
        # Example tag: ${IMMICH_VERSION:-release}-cuda
    user: "${DOCKER_USER_ID:-2004}:${DOCKER_GROUP_ID:-2004}"
    security_opt:
      # Prevent escalation of privileges after the container is started
      - no-new-privileges:true
    cap_drop:
      # Prevent access to raw network traffic
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      disable: false
    logging:
      driver: local
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_HOSTNAME: database
      DB_DATABASE_NAME: "${DB_DATABASE_NAME:-immich}"
    networks:
      - internal
    volumes:
      - model-cache:/cache
    deploy:
      resources:
        limits:
          cpus: "4.00"
          memory: 8G

  redis:
    image: "docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf"
    container_name: immich_redis
    restart: unless-stopped
    user: "${DOCKER_USER_ID:-2004}:${DOCKER_GROUP_ID:-2004}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    volumes:
      - redis-data:/data
    healthcheck:
      test: "redis-cli ping | grep -q PONG || exit 1"
    networks:
      - internal
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  database:
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23"
    container_name: immich_postgres
    user: "${DOCKER_USER_ID:-2004}:${DOCKER_GROUP_ID:-2004}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    depends_on:
      chown:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_DB: "${DB_DATABASE_NAME:-immich}"
      POSTGRES_INITDB_ARGS: "--data-checksums"
    networks:
      - internal
    logging:
      driver: local
    volumes:
      - database:/var/lib/postgresql/data
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2G

  # This image will mount the volume and then simply execute chown on the parent folder for the UID/GID specified.
  chown:
    image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command:
      - |
        chown -R ${DOCKER_USER_ID:-2004}:${DOCKER_GROUP_ID:-2004} /var/lib/postgresql/data
    networks: []
    volumes:
      - database:/var/lib/postgresql/data
    entrypoint: [/bin/ash, "-c"]
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
