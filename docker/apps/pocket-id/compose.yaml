---
name: pocket-id

networks:
  frontend:
    external: false

volumes:
  data:
    name: pocket-id-data

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2-distroless@sha256:a21166a4eb513d2ffcbf815398480998d996a9e719cfba029395517658626f9e
    read_only: true
    user: "${DOCKER_USER_ID:-2010}:${DOCKER_GROUP_ID:-2010}"
    depends_on:
      chown:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      APP_URL: "${APP_URL}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      TRUST_PROXY: "${TRUST_PROXY:-true}"
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY:-}"
      UI_CONFIG_DISABLED: true
      SMTP_FROM: "${SMTP_FROM}"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_TLS: "${SMTP_TLS}"
      SMTP_USER: "${SMTP_USER}"
      EMAIL_LOGIN_NOTIFICATION_ENABLED: "true"
      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "true"
      EMAIL_API_KEY_EXPIRATION_ENABLED: "true"
      EMAILS_VERIFIED: "${EMAILS_VERIFIED}"
    networks:
      - frontend
    volumes:
      - data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.external: "true"
      traefik.docker.network: pocket-id_frontend
      traefik.http.routers.pocketid-prod-1-http.entrypoints: web
      traefik.http.routers.pocketid-prod-1-http.rule: Host(`${APP_HOST}`)
      traefik.http.routers.pocketid-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.pocketid-prod-1-https.entrypoints: websecure
      traefik.http.routers.pocketid-prod-1-https.rule: Host(`${APP_HOST}`)
      traefik.http.routers.pocketid-prod-1-https.tls: "true"
      traefik.http.routers.pocketid-prod-1-https.tls.certresolver: ${HTTPS_TLS_CERTRESOLVER}

  # This image will mount the volume and then simply execute chown on the parent folder for the UID/GID specified.
  chown:
    image: alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command:
      - |
        chown -R ${DOCKER_USER_ID:-2010}:${DOCKER_GROUP_ID:-2010} /app/data
    networks: []
    volumes:
      - data:/app/data
    entrypoint: [/bin/ash, "-c"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
