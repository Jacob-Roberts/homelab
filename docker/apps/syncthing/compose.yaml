---
name: syncthing

networks:
  frontend:
    external: false

volumes:
  config:

services:
  syncthing:
    image: syncthing/syncthing:latest@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    container_name: syncthing
    hostname: ${SYNCTHING_HOSTNAME}
    user: "${DOCKER_USER_ID:-2011}:${DOCKER_GROUP_ID:-2011}"
    group_add:
      - "${DOCKER_GROUP_ID_CERT_MANAGER:-2013}"
      - "${DOCKER_GROUP_ID_JELLYFIN:-2003}"
    restart: unless-stopped
    ports:
      - 22000:22000/tcp # TCP file transfers
      - 22000:22000/udp # QUIC file transfers
    environment:
      PUID: "${DOCKER_USER_ID:-2011}"
      PGID: "${DOCKER_GROUP_ID:-2011}"
    networks:
      - frontend
    volumes:
      - config:/var/syncthing
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
    labels:
      traefik.enable: "true"
      traefik.docker.network: syncthing_frontend
      traefik.http.services.syncthing-prod-1.loadbalancer.server.port: '8384'
      traefik.http.routers.syncthing-prod-1-http.entrypoints: web
      traefik.http.routers.syncthing-prod-1-http.rule: Host(`${SYNCTHING_URL}`)
      traefik.http.routers.syncthing-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.syncthing-prod-1-https.entrypoints: websecure
      traefik.http.routers.syncthing-prod-1-https.rule: Host(`${SYNCTHING_URL}`)
      traefik.http.routers.syncthing-prod-1-https.tls: "true"
      traefik.http.routers.syncthing-prod-1-https.tls.certresolver: cloudflare
