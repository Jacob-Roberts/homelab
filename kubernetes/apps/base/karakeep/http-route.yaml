apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: karakeep
  namespace: karakeep
spec:
  parentRefs:
    - name: my-gateway
      namespace: cilium-gateway-system
  hostnames:
  - "karakeep.docker.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: karakeep
      port: 80
