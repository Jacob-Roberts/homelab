# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/Los_Angeles
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/pbj-pi
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: traefik
working_dir: docker/apps/traefik
compose_files: [compose.yaml, compose.ipv6.yaml]
environment:
    DOCKER_GROUP_ID: "992"
    HOST_IP_V4: "192.168.42.46"
    HOST_IP_V6: "2601:640:8000:1750:509f:96be:61ce:4c88"
    TRAEFIK_URL: "traefik.pbj-pi-1.jakerob.pro"
    WHOAMI_URL: "whoami.pbj-pi-1.jakerob.pro"
    NODE_NAME: "pbj-pi-1"
external_secrets:
    CF_DNS_API_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj-pi-1/traefik/CF_DNS_API_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: uptimekuma
working_dir: docker/apps/uptimekuma
compose_files: [compose.yaml]
environment:
    UPTIME_URL: uptime.pbj.jakerob.pro
