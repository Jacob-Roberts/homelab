---
name: whoami

networks:
  frontend:
    external: false

services:
  whoami-internal:
    image: docker.io/traefik/whoami
    command: "--verbose"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    labels:
      traefik.enable: "true"
      traefik.external: "false"
      traefik.docker.network: whoami_frontend
      traefik.http.routers.whoami-prod-1-http.entrypoints: web
      traefik.http.routers.whoami-prod-1-http.rule: Host(`${WHOAMI_INTERNAL_URL}`)
      traefik.http.routers.whoami-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.whoami-prod-1-https.entrypoints: websecure
      traefik.http.routers.whoami-prod-1-https.rule: Host(`${WHOAMI_INTERNAL_URL}`)
      traefik.http.routers.whoami-prod-1-https.tls: "true"
      traefik.http.routers.whoami-prod-1-https.tls.certresolver: cloudflare
