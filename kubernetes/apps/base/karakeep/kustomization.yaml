apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: karakeep
resources:
  - namespace.yaml
  - pvc.yaml
  - infisical-secret.yaml
  - deployment-web.yaml
  - deployment-chrome.yaml
  - deployment-meilisearch.yaml
  - network-policy.yaml
  - http-route.yaml
# Defaults for settings compose let .env override. Listed before the Infisical
# Secret in envFrom, so a value set in Infisical still wins. Hash-suffixed, so
# a change rolls the Deployment.
configMapGenerator:
  - name: karakeep-env
    literals:
      - DISABLE_SIGNUPS=false
      - DISABLE_PASSWORD_AUTH=true
      - OAUTH_AUTO_REDIRECT=false
