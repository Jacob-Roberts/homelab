# Public hostnames that iad1 tunnels to pbj over Netbird arrive at pbj's
# traefik-internal (the only Traefik bound to the Netbird IP). Hand them to
# the local traefik-external so public traffic always goes through the DMZ
# instance (crowdsec, geoblock). Keep this list in sync with the pbj routers in
# conf-external/tunnel-iad1.yaml.
http:
  services:
    traefik-external:
      loadBalancer:
        # traefik-external has no cert for the container hostname, so it serves
        # its self-signed default; skip verification on this local docker hop.
        serversTransport: ignorecert@file
        servers:
          - url: https://traefik-external

  routers:
    ### PBJ

    # WHOAMI PBJ (public test endpoint)
    whoami-pbj-https:
      entrypoints: websecure
      rule: "Host(`whoami-external-pbj.jakerob.pro`)"
      service: traefik-external
      tls: true

    # IMMICH
    immich-pbj-https:
      entrypoints: websecure
      rule: "Host(`photos.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Jellyfin
    jellyfin-pbj-https:
      entrypoints: websecure
      rule: "Host(`jellyfin.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Karakeep
    karakeep-pbj-https:
      entrypoints: websecure
      rule: "Host(`karakeep.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Calibre
    calibre-pbj-https:
      entrypoints: websecure
      rule: "Host(`calibre.jakerob.pro`)"
      service: traefik-external
      tls: true
