---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-max-map-count
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: sysctl-max-map-count
  template:
    metadata:
      labels:
        app: sysctl-max-map-count
    spec:
      hostPID: true
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 && sleep infinity"]
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi