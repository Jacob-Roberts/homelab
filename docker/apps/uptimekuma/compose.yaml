---
name: uptimekuma

networks:
  frontend:
    external: false

volumes:
  data:

services:
  uptimekuma:
    image: docker.io/louislam/uptime-kuma:2-rootless@sha256:ea1b2ceb6ef710a3d0d994debcc8cded062e534fb901f6e895f59caad68e0a9e
    container_name: uptimekuma
    user: "${DOCKER_USER_ID:-2018}:${DOCKER_GROUP_ID:-2018}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - data:/app/data
    logging:
      driver: "local"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.docker.network: uptimekuma_frontend
      traefik.http.routers.uptimekuma-prod-1-http.entrypoints: web
      traefik.http.routers.uptimekuma-prod-1-http.rule: Host(`${UPTIME_URL}`)
      traefik.http.routers.uptimekuma-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.uptimekuma-prod-1-https.entrypoints: websecure
      traefik.http.routers.uptimekuma-prod-1-https.rule: Host(`${UPTIME_URL}`)
      traefik.http.routers.uptimekuma-prod-1-https.tls: "true"
      traefik.http.routers.uptimekuma-prod-1-https.tls.certresolver: cloudflare
