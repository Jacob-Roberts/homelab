# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/Denver
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/slc1
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: nginx
working_dir: docker/apps/nginx
compose_files: [compose.yaml]
environment:
    NGINX_HOST: nginx.slc1.jakerob.pro

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: webnut
working_dir: docker/apps/webnut
compose_files: [compose.yaml]
environment:
    UPS_HOST: 192.168.97.73
    UPS_PORT: "3493"
    WEBNUT_URL: webnut.slc1.jakerob.pro
external_secrets:
    UPS_USER: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/webnut/UPS_USER"
    UPS_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/webnut/UPS_PASSWORD"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: immich
working_dir: docker/apps/immich
compose_files: [compose.yaml]
environment:
    APP_URL: photos.autovation.com
external_secrets:
    DB_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/immich/DB_PASSWORD"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: jellyfin
working_dir: docker/apps/jellyfin
compose_files: [compose.yaml]
environment:
    DOCKER_USER_ID: 1000
    DOCKER_GROUP_ID: 1000
    APP_URL: "https://jellyfin.slc1.jakerob.pro"
    JELLYFIN_URL: "jellyfin.slc1.jakerob.pro"
    JELLYDATA_HOST_PATH: "/nfs/jellydata"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: pocket-id
working_dir: docker/apps/pocket-id
compose_files: [compose.yaml]
environment:
    APP_URL: "https://auth.autovation.com"
    APP_HOST: auth.autovation.com
    EMAILS_VERIFIED: "true"
    HTTPS_TLS_CERTRESOLVER: "cloudflare"
external_secrets:
    ENCRYPTION_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/ENCRYPTION_KEY"
    SMTP_FROM: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_FROM"
    SMTP_HOST: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_HOST"
    SMTP_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_PASSWORD"
    SMTP_PORT: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_PORT"
    SMTP_TLS: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_TLS"
    SMTP_USER: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/slc1-node-3/pocket-id/SMTP_USER"
