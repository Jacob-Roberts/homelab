---
# Run: ansible-playbook playbooks/qemu-guest-agent.yaml [-l <host>]
# Lets Proxmox see guest IPs and shut VMs down cleanly.
- name: QEMU guest agent
  hosts: qemu
  become: true

  tasks:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600

    # The unit is static (started by udev when the virtio port exists), so
    # only ensure it is running.
    - name: Start qemu-guest-agent
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
