---

networks:
  frontend-external:
    external: false

services:
  whoami-external:
    image: docker.io/traefik/whoami@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    command: "--verbose"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend-external
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M
    labels:
      traefik.enable: "true"
      traefik.external: "true"
      traefik.docker.network: "whoami_frontend-external"
      traefik.http.routers.whoamitunnel-prod-1-http.entrypoints: web
      traefik.http.routers.whoamitunnel-prod-1-http.rule: Host(`${WHOAMI_EXTERNAL_URL}`)
      traefik.http.routers.whoamitunnel-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.whoamitunnel-prod-1-https.entrypoints: websecure
      traefik.http.routers.whoamitunnel-prod-1-https.rule: Host(`${WHOAMI_EXTERNAL_URL}`)
      traefik.http.routers.whoamitunnel-prod-1-https.tls: "true"
      traefik.http.routers.whoamitunnel-prod-1-https.tls.certresolver: "${EXTERNAL_TLS_CERTRESOLVER}"
