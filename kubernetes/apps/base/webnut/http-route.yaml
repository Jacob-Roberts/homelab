apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webnut
  namespace: webnut
spec:
  parentRefs:
    - name: my-gateway
      namespace: cilium-gateway-system
  hostnames:
  - "webnut.docker.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: webnut
      port: 80
