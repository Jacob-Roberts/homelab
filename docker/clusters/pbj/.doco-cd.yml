# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/Los_Angeles
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/pbj
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: traefik
working_dir: docker/infrastructure/traefik
compose_files: [compose.yaml, compose.ipv6.yaml, compose_external.yaml, compose_external.ipv6.yaml, networks/pbj.yaml, overrides/pbj.yaml]
environment:
    DOCKER_GROUP_ID: "988"
    HOST_IP_V4: "192.168.42.120"
    HOST_IP_V6: "2601:640:8000:1750:be24:11ff:feea:1964"
    NETBIRD_IP_V4: "100.107.80.160"
    NETBIRD_IP_V6: "fdbd:db6a:5351:2c4:4c58:8c56:c12c:5498"
    TRAEFIK_INTERNAL_URL: "traefik.pbj.jakerob.pro"
    TRAEFIK_EXTERNAL_URL: "pbj-node-1.jakerob.pro"
    NODE_NAME: "pbj-node-1"
external_secrets:
    CF_DNS_API_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/traefik/CF_DNS_API_TOKEN"
    CROWDSEC_TRAEFIK_BOUNCER_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/traefik/CROWDSEC_TRAEFIK_BOUNCER_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: crowdsec
working_dir: docker/infrastructure/crowdsec
compose_files: [compose.yaml]
environment:
    DOCKER_GROUP_ID: "999"
external_secrets:
    CROWDSEC_TRAEFIK_BOUNCER_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/traefik/CROWDSEC_TRAEFIK_BOUNCER_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: whoami
working_dir: docker/apps/whoami
compose_files: [compose.yaml, compose.external.yaml]
environment:
    WHOAMI_INTERNAL_URL: whoami.pbj.jakerob.pro
    WHOAMI_EXTERNAL_URL: whoami-pbj.jakerob.pro
    EXTERNAL_TLS_CERTRESOLVER: cloudflare

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: calibre
working_dir: docker/apps/calibre
compose_files: [compose.yaml]
environment:
    TZ: America/Los_Angeles
    CALIBRE_URL: calibre.jakerob.pro

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: immich
working_dir: docker/apps/immich
compose_files: [compose.yaml]
environment:
    APP_URL: photos.jakerob.pro
external_secrets:
    DB_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/immich/DB_PASSWORD"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: karakeep
working_dir: docker/apps/karakeep
compose_files: [compose.yaml]
environment:
    DISABLE_PASSWORD_AUTH: "true"
    OAUTH_AUTO_REDIRECT: "false"
    OAUTH_CLIENT_ID: "0ac445dd-1ada-4e18-b15b-801b1374a7d1"
    OAUTH_PROVIDER_NAME: "pocket-id"
    OAUTH_WELLKNOWN_URL: "https://auth.jakerob.pro/.well-known/openid-configuration"
external_secrets:
    MEILI_MASTER_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/karakeep/MEILI_MASTER_KEY"
    NEXTAUTH_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/karakeep/NEXTAUTH_SECRET"
    OAUTH_CLIENT_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/karakeep/OAUTH_CLIENT_SECRET"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: jellyfin
working_dir: docker/apps/jellyfin
compose_files: [compose.yaml, compose.pbj.yaml]
environment:
    APP_URL: "https://jellyfin.jakerob.pro"
    JELLYFIN_URL: "jellyfin.jakerob.pro"
    STORAGE_URL: "truenas.pbj.jakerob.pro"
    JELLYDATA_HOST_PATH: "/media/jellydata"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: semaphore
working_dir: docker/apps/semaphore
compose_files: [compose.yaml]
environment:
    SEMAPHORE_ADMIN: "admin"
    SEMAPHORE_ADMIN_EMAIL: "admin@localhost"
    SEMAPHORE_ADMIN_NAME: "admin"
    SEMAPHORE_URL: "semaphore.pbj.jakerob.pro"
external_secrets:
    NETBIRD_SETUPKEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/semaphore/NETBIRD_SETUPKEY"
    SEMAPHORE_ACCESS_KEY_ENCRYPTION: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/semaphore/SEMAPHORE_ACCESS_KEY_ENCRYPTION"
    SEMAPHORE_ADMIN_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/semaphore/SEMAPHORE_ADMIN_PASSWORD"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: syncthing
working_dir: docker/apps/syncthing
compose_files: [compose.yaml, compose.jellydata.yaml]
environment:
    SYNCTHING_HOSTNAME: "syncthing-pbj"
    SYNCTHING_URL: "syncthing.pbj.jakerob.pro"
    JELLYDATA_HOST_PATH: "/media/jellydata"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: media-acquisition
working_dir: docker/apps/media-management/acquisition
compose_files: [compose.yaml]
environment:
    JELLYDATA_HOST_PATH: /media/jellydata
    BAZARR_URL: "bazarr.pbj.jakerob.pro"
    PROWLARR_URL: "prowlarr.pbj.jakerob.pro"
    QBITTORRENT_URL: "qbittorrent.pbj.jakerob.pro"
    RADARR_URL: "radarr.pbj.jakerob.pro"
    SHELFMARK_URL: "shelfmark.pbj.jakerob.pro"
    SONARR_URL: "sonarr.pbj.jakerob.pro"
    TDARR_URL: "tdarr.pbj.jakerob.pro"
external_secrets:
    HARDCOVER_API_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/media-management/HARDCOVER_API_KEY"
    WIREGUARD_PRIVATE_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/pbj/media-management/WIREGUARD_PRIVATE_KEY"
