---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: wazuh-secrets
  namespace: wazuh
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectId: f3732b81-3a85-430d-a547-43b85c363ad6
        envSlug: prod
        secretsPath: /pbj/wazuh
        recursive: true
  managedSecretReference:
    secretName: wazuh-secrets
    secretNamespace: wazuh
    creationPolicy: Owner