---
name: myspeed

networks:
  frontend:
    external: false

volumes:
  data:

services:
  myspeed:
    image: docker.io/germannewsmaker/myspeed:1.0.9@sha256:3a3e774b3f78d930a5a962d625b99bcb3d71730bfeb4a6b93e04fd38cfe7d9a9
    container_name: myspeed
    user: "${DOCKER_USER_ID:-2017}:${DOCKER_GROUP_ID:-2017}"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      PUID: "${DOCKER_USER_ID:-2017}"
      PGID: "${DOCKER_GROUP_ID:-2017}"
    networks:
      - frontend
    volumes:
      - data:/myspeed/data:rw
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.docker.network: myspeed_frontend
      traefik.http.services.myspeed-prod-1.loadBalancer.server.port: 5216
      traefik.http.routers.myspeed-prod-1-http.entrypoints: web
      traefik.http.routers.myspeed-prod-1-http.rule: Host(`${MYSPEED_URL}`)
      traefik.http.routers.myspeed-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.myspeed-prod-1-https.entrypoints: websecure
      traefik.http.routers.myspeed-prod-1-https.rule: Host(`${MYSPEED_URL}`)
      traefik.http.routers.myspeed-prod-1-https.tls: "true"
      traefik.http.routers.myspeed-prod-1-https.tls.certresolver: cloudflare
