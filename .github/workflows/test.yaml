name: test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'kubernetes/**'

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@6f81f5c8fa69fc5aea343989a2958212d827121c # main
      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@e0c1965b73a3743ac7924c68779336589f53e94d # main
      - name: Validate manifests
        uses: fluxcd/flux-schema/actions/validate@e0c1965b73a3743ac7924c68779336589f53e94d # main
        with:
          path: './kubernetes'
          config: './kubernetes/.fluxschema.yml'
          # Talos machine-config patches are not Kubernetes manifests.
          exclude: |
            ./kubernetes/talos
      - name: Validate API versions
        run: |
          flux migrate -f ./kubernetes --yes
          if [[ $(git diff --stat) != '' ]]; then
            git --no-pager diff
            echo 'deprecated API versions found, run flux migrate and commit changes'
            exit 1
          fi
