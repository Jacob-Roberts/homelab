# This tunnel only uses http
http:
  services:
    traefik-external:
      loadBalancer:
        # traefik-external has no cert for the container hostname, so it serves
        # its self-signed default; skip verification on this local docker hop.
        serversTransport: ignorecert@file
        servers:
          - url: https://traefik-external

  routers:
    ### PBJ

    # WHOAMI PBJ
    whoami-pbj-https:
      entrypoints: websecure
      rule: "Host(`whoami-tunnel.pbj.jakerob.pro`)"
      service: traefik-external
      tls: true

    # IMMICH
    immich-pbj-https:
      entrypoints: websecure
      rule: "Host(`photos.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Jellyfin
    jellyfin-pbj-https:
      entrypoints: websecure
      rule: "Host(`jellyfin.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Karakeep
    karakeep-pbj-https:
      entrypoints: websecure
      rule: "Host(`karakeep.jakerob.pro`)"
      service: traefik-external
      tls: true

    # Calibre
    calibre-pbj-https:
      entrypoints: websecure
      rule: "Host(`calibre.jakerob.pro`)"
      service: traefik-external
      tls: true
