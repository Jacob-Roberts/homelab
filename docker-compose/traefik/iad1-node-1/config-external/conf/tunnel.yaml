http:
  services:
    pbj-tunnel:
      loadBalancer:
        servers:
          - url: https://pbj-node-1.vpn.jakerob.pro

    slc1-tunnel:
      loadBalancer:
        servers:
          - url: https://slc1-node-3.vpn.jakerob.pro

    # Kubernetes Gateway (shared). Reached over Netbird, plain HTTP;
    # Cilium picks listeners by SNI, so the Host header routes correctly.
    k8s-gateway:
      loadBalancer:
        servers:
          - url: http://192.168.42.200

  routers:
    # WHOAMI pbj
    whoami-tunnel-pbj-http:
      entrypoints: web
      rule: "Host(`whoami-tunnel.pbj.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    whoami-tunnel-pbj-https:
      entrypoints: websecure
      rule: "Host(`whoami-tunnel.pbj.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    immich-pbj-http:
      entrypoints: web
      rule: "Host(`photos.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    immich-pbj-https:
      entrypoints: websecure
      rule: "Host(`photos.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    jellyfin-pbj-http:
      entrypoints: web
      rule: "Host(`jellyfin.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    jellyfin-pbj-https:
      entrypoints: websecure
      rule: "Host(`jellyfin.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    karakeep-pbj-http:
      entrypoints: web
      rule: "Host(`karakeep.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    karakeep-pbj-https:
      entrypoints: websecure
      rule: "Host(`karakeep.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    calibre-pbj-http:
      entrypoints: web
      rule: "Host(`calibre.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    calibre-pbj-https:
      entrypoints: websecure
      rule: "Host(`calibre.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    pocket-id-pbj-http:
      entrypoints: web
      rule: "Host(`pocket-id.lhr1.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    pocket-id-pbj-https:
      entrypoints: websecure
      rule: "Host(`pocket-id.lhr1.jakerob.pro`)"
      service: pbj-tunnel
      tls: true

    # Kubernetes apps published through iad1. The certificate is minted here
    # with HTTP-01 (the public hostname points at iad1). The route stays on
    # my-gateway so the local split-horizon path keeps working unchanged.
    auth-jakerob-http:
      entrypoints: web
      rule: "Host(`auth.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: k8s-gateway
    auth-jakerob-https:
      entrypoints: websecure
      rule: "Host(`auth.jakerob.pro`)"
      service: k8s-gateway
      tls:
        certResolver: letsencrypt

    whoami-tunnel-slc1-http:
      entrypoints: web
      rule: "Host(`whoami-tunnel.slc1.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    whoami-tunnel-slc1-https:
      entrypoints: websecure
      rule: "Host(`whoami-tunnel.slc1.jakerob.pro`)"
      service: slc1-tunnel
      tls: true

    pocket-id-slc1-http:
      entrypoints: web
      rule: "Host(`auth.autovation.com`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    pocket-id-slc1-https:
      entrypoints: websecure
      rule: "Host(`auth.autovation.com`)"
      service: slc1-tunnel
      tls: true

    photos-slc1-http:
      entrypoints: web
      rule: "Host(`photos.autovation.com`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    photos-slc1-https:
      entrypoints: websecure
      rule: "Host(`photos.autovation.com`)"
      service: slc1-tunnel
      tls: true

