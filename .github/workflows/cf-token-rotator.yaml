name: cf-token-rotator

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tools/cf-token-rotator/**"
      - "kubernetes/apps/base/cf-token-rotator/config.yaml"
      - ".github/workflows/cf-token-rotator.yaml"
  push:
    # Release: git tag cf-token-rotator/v0.1.0 && git push origin cf-token-rotator/v0.1.0
    tags: ["cf-token-rotator/v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/cf-token-rotator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/cf-token-rotator/go.mod
          cache-dependency-path: tools/cf-token-rotator/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Also validates kubernetes/apps/base/cf-token-rotator/config.yaml.
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jacob-roberts/cf-token-rotator
          tags: |
            type=match,pattern=cf-token-rotator/v(.*),group=1
            type=sha
      - if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: tools/cf-token-rotator
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
