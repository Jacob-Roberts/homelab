---
name: mindustry

services:
  mindsutry:
    image: ghcr.io/jacob-roberts/mindustry:0.0.1@sha256:ea1bd26e16e4badc285a818b614608bf43a42f8d73d0b774b530a2ce7db5d49d
    container_name: mindustry
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    ports:
      - 6567:6567/tcp
      - 6567:6567/udp
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
