---
# Install with: ansible-galaxy install -r requirements.yml
# Roles land in ./roles and collections in ./collections (see ansible.cfg);
# both directories are gitignored.
roles:
  - name: geerlingguy.docker
    version: 8.0.0
  - name: geerlingguy.security
    version: 3.1.0
  - name: geerlingguy.nut_client
    version: 2.0.0

collections:
  - name: community.docker
    version: 5.4.0
  - name: ansible.posix
    version: 2.2.2
  - name: community.general
    version: 14.0.1
