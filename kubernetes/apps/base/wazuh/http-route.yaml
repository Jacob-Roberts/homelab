---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wazuh
  namespace: wazuh
spec:
  parentRefs:
    - name: my-gateway
      namespace: cilium-gateway-system
  hostnames:
  - "wazuh.docker.localhost"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: wazuh-dashboard
      port: 5601