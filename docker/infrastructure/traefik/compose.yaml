# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
---
name: traefik

networks:
  internal:
    # Contains traefik and socket proxy
    external: false
    name: traefik_internal

volumes:
  socket-proxy:
  plugins:
  certs-storage:

services:
  # Traefik internal is the reverse proxy for any internal services (only exposed to me)
  traefik-internal:
    image: docker.io/traefik:v3@sha256:b7b1b31e6440de0b1f7c4e0f6cf0a0f3f004866761d30c025fe00c80daaf7d9c
    container_name: traefik-internal
    command:
      - "--configFile=/traefik/traefik.yaml"
    read_only: true
    user: "${TRAEFIK_SRV_ID:-2001}:${TRAEFIK_GROUP_ID:-2001}"
    security_opt:
      - no-new-privileges:true
    sysctls:
      # allow rootless container to access ports < 1024
      net.ipv4.ip_unprivileged_port_start: 80
    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    logging:
      driver: local
    healthcheck:
      # https://doc.traefik.io/traefik/operations/cli/#healthcheck
      test: [CMD, traefik, healthcheck, "--ping", "--configFile=/traefik/traefik.yaml"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      # This service is **only** exposed on the VPN
      - "${NETBIRD_IP_V4}:80:80/tcp"
      - "${NETBIRD_IP_V4}:443:443/tcp"
      - "${NETBIRD_IP_V4}:443:443/udp"
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
      TZ: "${TZ:-UTC}"
      TRAEFIK_URL: "${TRAEFIK_INTERNAL_URL}"
      NODE_NAME: "${NODE_NAME}-internal"
    networks:
      - internal
    volumes:
      - ./config/traefik-internal.yaml:/traefik/traefik.yaml:ro
      - ./config/conf-shared/identify-node.yaml:/traefik/conf/identify-node.yaml:ro
      - ./config/conf-shared/ping-https.yaml:/traefik/conf/ping-https.yaml:ro
      - ./config/conf-shared/websecure-redirect.yaml:/traefik/conf/websecure-redirect.yaml:ro
      - ./config/conf-shared/insecure-skip-verify-cert.yaml:/traefik/conf/insecure-skip-verify-cert.yaml:ro
      - plugins:/plugins-storage/:rw
      - certs-storage:/traefik/certs:rw
      # access docker socket via proxy read-only
      - socket-proxy:/var/run
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.external: "false"
      traefik.http.routers.traefikinternal-prod-1-http.service: "api@internal"
      traefik.http.routers.traefikinternal-prod-1-https.service: "api@internal"
      traefik.http.routers.traefikinternal-prod-1-http.entrypoints: web
      traefik.http.routers.traefikinternal-prod-1-http.rule: "Host(`${TRAEFIK_INTERNAL_URL}`) && !PathPrefix(`/ping`)"
      traefik.http.routers.traefikinternal-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.traefikinternal-prod-1-https.entrypoints: websecure
      traefik.http.routers.traefikinternal-prod-1-https.rule: "Host(`${TRAEFIK_INTERNAL_URL}`) && !PathPrefix(`/ping`)"
      traefik.http.routers.traefikinternal-prod-1-https.tls: "true"
      traefik.http.routers.traefikinternal-prod-1-https.tls.certresolver: cloudflare

  socket-proxy:
    image: docker.io/11notes/socket-proxy:2@sha256:eeb341c66337b95eaed9e710b12754e0cd59c4cbc521b8324ff906787c69934e
    container_name: traefik-socket-proxy
    read_only: true
    user: "0:${DOCKER_GROUP_ID}" # Lookup the docker group ID using `getent group docker`
    restart: unless-stopped
    environment:
      SOCKET_PROXY_UID: "${TRAEFIK_SRV_ID:-2001}"
      SOCKET_PROXY_GID: "${TRAEFIK_GROUP_ID:-2001}"
    networks:
      - internal
    volumes:
      # mount host docker socket, the :ro does not mean read-only for the socket, just for the actual file
      - /run/docker.sock:/run/docker.sock:ro
      # this socket is run as 1000:1000, not as root!
      - socket-proxy:/run/proxy
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
