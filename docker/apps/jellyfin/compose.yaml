---
name: jellyfin

networks:
  frontend:
    external: false

volumes:
  cache:
    name: jellyfin_cache
  config:
    name: jellyfin_config

services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:12
    container_name: jellyfin
    hostname: jellyfin-pbj
    user: "${DOCKER_USER_ID:-2003}:${DOCKER_GROUP_ID:-2003}"
    restart: unless-stopped
    environment:
      PUID: "${DOCKER_USER_ID:-2003}"
      PGID: "${DOCKER_GROUP_ID:-2003}"
      TZ: ${TZ:-UTC}
      JELLYFIN_PublishedServerUrl: ${APP_URL}
    networks:
      - frontend
    # devices:
    #   - /dev/dri:/dev/dri
    volumes:
      - config:/config
      - cache:/cache
      - ${JELLYDATA_HOST_PATH}:/jellydata
    # group_add:
    #   - ${HARDWARE_VIDEO_GROUP_ID:-993} # get this from ls -g /dev/dri
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
    labels:
      traefik.enable: "true"
      traefik.external: "true"
      traefik.docker.network: jellyfin_frontend
      traefik.http.services.jellyfin-prod-1.loadBalancer.server.port: 8096
      traefik.http.routers.jellyfin-prod-1-http.entrypoints: web
      traefik.http.routers.jellyfin-prod-1-http.rule: Host(`${JELLYFIN_URL}`)
      traefik.http.routers.jellyfin-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.jellyfin-prod-1-https.entrypoints: websecure
      traefik.http.routers.jellyfin-prod-1-https.rule: Host(`${JELLYFIN_URL}`)
      traefik.http.routers.jellyfin-prod-1-https.tls: "true"
      traefik.http.routers.jellyfin-prod-1-https.tls.certresolver: cloudflare
