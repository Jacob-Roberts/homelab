---
# =============================================================================
# Admin users (first run on a new host)
# =============================================================================
# Run once per new host, connecting as whatever user the image ships with:
#   ansible-playbook playbooks/bootstrap-users.yaml -l <host> -e ansible_user=ubuntu
#
# Creates every account in admin_users (group_vars/all.yaml), installs its
# key from ansible/ssh_keys/<name>.pub and grants passwordless sudo. After
# this, every other playbook connects as ansible-robot.
# Safe to re-run, e.g. after adding an admin or rotating a key.
# =============================================================================

- name: Admin users
  hosts: hardened
  become: true

  vars:
    ssh_keys_dir: "{{ playbook_dir | dirname }}/ssh_keys"

  tasks:
    - name: Ensure every admin has a public key
      ansible.builtin.assert:
        that: (ssh_keys_dir ~ '/' ~ item.name ~ '.pub') is file
        fail_msg: "Missing {{ ssh_keys_dir }}/{{ item.name }}.pub"
        quiet: true
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false

    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        groups: sudo
        append: true
        create_home: true
        state: present
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install admin SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ lookup('ansible.builtin.file', ssh_keys_dir ~ '/' ~ item.name ~ '.pub') }}"
        state: present
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Grant admins passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admins
        content: |
          # Managed by ansible (playbooks/bootstrap-users.yaml)
          {% for user in admin_users %}
          {{ user.name }} ALL=(ALL) NOPASSWD:ALL
          {% endfor %}
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Next step
      ansible.builtin.debug:
        msg: >-
          Admin users are ready. Run the rest as the automation user, e.g.
          ansible-playbook playbooks/site.yaml -l {{ inventory_hostname }}
