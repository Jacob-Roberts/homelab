---
name: it-tools

networks:
  frontend:
    external: false

services:
  it-tools:
    image: docker.io/corentinth/it-tools:latest@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
    container_name: it-tools
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "true"
      traefik.external: "true"
      traefik.docker.network: it-tools_frontend
      traefik.http.routers.ittools-prod-1-http.entrypoints: web
      traefik.http.routers.ittools-prod-1-http.rule: Host(`${IT_TOOLS_URL:-it-tools.jakerob.pro}`)
      traefik.http.routers.ittools-prod-1-http.middlewares: "websecure-redirect-permanent@file"
      traefik.http.routers.ittools-prod-1-https.entrypoints: websecure
      traefik.http.routers.ittools-prod-1-https.rule: Host(`${IT_TOOLS_URL:-it-tools.jakerob.pro}`)
      traefik.http.routers.ittools-prod-1-https.tls: "true"
      traefik.http.routers.ittools-prod-1-https.tls.certresolver: letsencrypt
      traefik.http.services.ittools-prod-1.loadbalancer.server.port: 80
