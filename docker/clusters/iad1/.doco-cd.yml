# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/New_York
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/iad1
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: traefik
working_dir: docker/infrastructure/traefik
compose_files: [compose.yaml, compose_external.yaml, networks/iad1.yaml, overrides/iad1.yaml]
environment:
    DOCKER_GROUP_ID: "999"
    HOST_IP_V4: "10.0.0.13"
    NETBIRD_IP_V4: "100.107.140.137"
    TRAEFIK_INTERNAL_URL: "traefik.iad1.jakerob.pro"
    TRAEFIK_EXTERNAL_URL: "traefik-external.iad1.jakerob.pro"
    NODE_NAME: "iad1-node-1"
external_secrets:
    CF_DNS_API_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/traefik/CF_DNS_API_TOKEN"
    CROWDSEC_TRAEFIK_BOUNCER_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/traefik/CROWDSEC_TRAEFIK_BOUNCER_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: crowdsec
working_dir: docker/infrastructure/crowdsec
compose_files: [compose.yaml]
external_secrets:
    CROWDSEC_TRAEFIK_BOUNCER_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/traefik/CROWDSEC_TRAEFIK_BOUNCER_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: convertx
working_dir: docker/apps/convertx
compose_files: [compose.yaml]
external_secrets:
    JWT_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/convertx/JWT_SECRET"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: spotify-analytics
