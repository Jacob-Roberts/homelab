apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-token-rotator
  namespace: cf-token-rotator
---
# Read only the synced token Secret, to confirm the Infisical operator has
# picked up a new value before anything is restarted or revoked.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cf-token-rotator
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudflare-api-token]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cf-token-rotator
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cf-token-rotator
subjects:
  - kind: ServiceAccount
    name: cf-token-rotator
    namespace: cf-token-rotator
---
# external-dns reads the token from an env var, so it also needs a restart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cf-token-rotator
  namespace: external-dns
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [cloudflare-api-token]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [external-dns]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cf-token-rotator
  namespace: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cf-token-rotator
subjects:
  - kind: ServiceAccount
    name: cf-token-rotator
    namespace: cf-token-rotator
