---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  # Force Flux to wait for the Gateway API CRDs
  dependsOn:
    - name: gateway-api-crds
      namespace: flux-system
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    # Required for Kind to locate the control plane
    k8sServiceHost: kind-control-plane
    k8sServicePort: 6443
    
    # Fully replace kube-proxy 
    kubeProxyReplacement: true
    
    # Enable the Gateway API controller
    gatewayAPI:
      enabled: true
      
    # Required by the Gateway API implementation
    l7Proxy: true