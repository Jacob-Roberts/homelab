    TOTP_VAULT_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/plausible/TOTP_VAULT_KEY"
    DATABASE_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/plausible/DATABASE_PASSWORD"
    MAILER_EMAIL: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/plausible/MAILER_EMAIL"
