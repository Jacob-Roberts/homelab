---
# =============================================================================
# NetBird client
# =============================================================================
# Run: ansible-playbook playbooks/netbird.yaml [-l <host>]
#
# Installs the client from NetBird's apt repo. Joining the network
# (`netbird up --setup-key ...`) stays a manual step: setup keys are
# one-time secrets.
#
# The keyring and repo paths match what existing hosts already have; changing
# signed-by under the same repo file would leave two conflicting entries.
# =============================================================================

- name: NetBird client
  hosts: netbird
  become: true

  vars:
    netbird_keyring: /usr/share/keyrings/netbird-archive-keyring.gpg

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Check for the NetBird signing key
      ansible.builtin.stat:
        path: "{{ netbird_keyring }}"
      register: netbird_keyring_file

    - name: Install the NetBird signing key
      when: not netbird_keyring_file.stat.exists
      block:
        - name: Download the NetBird signing key
          ansible.builtin.get_url:
            url: https://pkgs.netbird.io/debian/public.key
            dest: /tmp/netbird-public.key
            mode: "0644"

        - name: Dearmor the NetBird signing key
          ansible.builtin.command:
            cmd: gpg --dearmor --yes --output {{ netbird_keyring }} /tmp/netbird-public.key
            creates: "{{ netbird_keyring }}"

    - name: Configure the NetBird apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by={{ netbird_keyring }}] https://pkgs.netbird.io/debian stable main"
        filename: netbird
        state: present

    - name: Install NetBird
      ansible.builtin.apt:
        name: netbird
        state: present
        update_cache: true
