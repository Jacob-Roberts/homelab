apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    kubeProxyReplacement: true
    gatewayAPI:
      enabled: true
    l7Proxy: true
