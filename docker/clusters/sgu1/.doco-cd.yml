# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/Denver
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/sgu1
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: traefik
working_dir: docker/apps/traefik
compose_files: [compose.yaml]
environment:
    DOCKER_GROUP_ID: "996"
    HOST_IP_V4: "192.168.59.194"
    TRAEFIK_URL: "traefik.sgu1.jakerob.pro"
    WHOAMI_URL: "whoami.sgu1.jakerob.pro"
external_secrets:
    CF_DNS_API_TOKEN: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/sgu1-node-1/traefik/CF_DNS_API_TOKEN"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: jellyfin
working_dir: docker/apps/jellyfin
compose_files: [compose.yaml]
environment:
    DOCKER_USER_ID: 2003
    DOCKER_GROUP_ID: 2003
    APP_URL: "https://jellyfin.sgu1.jakerob.pro"
    JELLYFIN_URL: "jellyfin.sgu1.jakerob.pro"
    JELLYDATA_HOST_PATH: "/media/jellydata"
