# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
# doco-cd deploys itself from this repo. The stack name and the service name
# must match the managed Compose project and service so doco-cd recognises
# the stack as its own after the bootstrap.
name: doco-cd
working_dir: docker/infrastructure/doco-cd
compose_files: [compose.yaml]
timeout: 120
environment:
    TZ: America/New_York
    DEPLOY_CONFIG_BASE_DIR: docker/clusters/iad1
    SECRET_PROVIDER_CLIENT_ID: bee04ce7-0037-4531-9e59-a2d015f7f2a2

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: nginx
working_dir: docker/apps/nginx
compose_files: [compose.yaml]
environment:
    NGINX_HOST: nginx.iad1.jakerob.pro

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: convertx
working_dir: docker/apps/convertx
compose_files: [compose.yaml]
external_secrets:
    JWT_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/convertx/JWT_SECRET"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: spotify-analytics
working_dir: docker/apps/spotify-analytics
compose_files: [compose.yaml]
external_secrets:
    SPOTIFY_PUBLIC: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/spotify-analytics/SPOTIFY_PUBLIC"
    SPOTIFY_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/spotify-analytics/SPOTIFY_SECRET"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: it-tools
working_dir: docker/apps/it-tools
compose_files: [compose.yaml]

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: mealie
working_dir: docker/apps/mealie
compose_files: [compose.yaml]
environment:
    OIDC_CONFIGURATION_URL: "https://pocket-id.iad1.jakerob.pro/.well-known/openid-configuration"
    OIDC_CLIENT_ID: "1f3f8740-8220-4ea8-9168-11633e79a218"
    TZ: UTC
external_secrets:
    OIDC_CLIENT_SECRET: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/mealie/OIDC_CLIENT_SECRET"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: pocket-id
working_dir: docker/apps/pocket-id
compose_files: [compose.yaml]
environment:
    APP_URL: "https://pocket-id.iad1.jakerob.pro"
    APP_HOST: pocket-id.iad1.jakerob.pro
    EMAILS_VERIFIED: "true"
external_secrets:
    ENCRYPTION_KEY: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/ENCRYPTION_KEY"
    SMTP_FROM: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_FROM"
    SMTP_HOST: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_HOST"
    SMTP_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_PASSWORD"
    SMTP_PORT: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_PORT"
    SMTP_TLS: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_TLS"
    SMTP_USER: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/pocket-id/SMTP_USER"

---
# yaml-language-server: $schema=https://doco.cd/latest/schemas/deploy.schema.json
name: joplin
working_dir: docker/apps/joplin
compose_files: [compose.yaml]
environment:
    POSTGRES_USER: "joplin"
    POSTGRES_DATABASE: "joplin"
external_secrets:
    POSTGRES_PASSWORD: "f3732b81-3a85-430d-a547-43b85c363ad6:prod:/iad1-node-1/joplin/POSTGRES_PASSWORD"
