---
name: factorio

volumes:
  data:

services:
  factorio:
    image: docker.io/factoriotools/factorio:2.1.25-rootless@sha256:48569b7b8867578844bf41c558aed94d9dbe0ced03cfe711dfc6b6ca5dabf164
    container_name: factorio
    user: "${DOCKER_USER_ID:-2020}:${DOCKER_GROUP_ID:-2020}"
    restart: unless-stopped
    ports:
      - 34197:34197/udp
      - 27015:27015/tcp
    environment:
      GENERATE_NEW_SAVE: "true"
      SAVE_NAME: "${SAVE_NAME:-my-save}"
      UPDATE_MODS_ON_START: "true"
      DLC_SPACE_AGE: "${DLC_SPACE_AGE:-false}"
      USERNAME: "${USERNAME}"
      TOKEN: "${TOKEN}"
    volumes:
      - data:/factorio
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
