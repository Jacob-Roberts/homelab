apiVersion: v1
kind: Service
metadata:
  # Must precisely match the name Cilium generates
  name: cilium-gateway-my-gateway
  # Must match the namespace of your Gateway
  namespace: cilium-gateway-system
  labels:
    io.cilium/gateway-name: my-gateway
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      protocol: TCP
      # Pins it exactly to your Kind host port mapping
      nodePort: 30080