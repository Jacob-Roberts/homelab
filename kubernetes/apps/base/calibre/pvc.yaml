---
# Calibre-Web-Automated keeps its SQLite config (app.db/cwa.db) on disk.
# Move calibre-config to iSCSI block because it is SQLite (WAL) — same
# constraint as Pocket ID: POSIX locks + shared-memory mmap don't work over NFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config
  namespace: calibre
spec:
  storageClassName: iscsi-nvme
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-ingest
  namespace: calibre
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-library
  namespace: calibre
spec:
  storageClassName: nfs
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
