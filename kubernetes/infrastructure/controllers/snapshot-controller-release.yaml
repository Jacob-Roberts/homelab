---
# The upstream CSI external-snapshotter controller and its VolumeSnapshot CRDs,
# which Talos does not ship. The TrueNAS CSI driver provisions snapshots, but
# something has to reconcile the VolumeSnapshot objects into CSI calls.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 1h
  targetNamespace: snapshot-controller
  chart:
    spec:
      chart: snapshot-controller
      version: "5.3.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: snapshot-controller
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    # CRDs are installed as regular chart resources in 5.x, and kept when the
    # release is removed so existing VolumeSnapshots are not orphaned.
    installCRDs: true
    keepCRDs: true
