apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base/whoami
  - ../base/podinfo
  - ../base/beszel
  - ../base/homepage
  - ../base/calibre
  - ../base/pocket-id
patches:
  - path: podinfo-values.yaml
    target:
      kind: HelmRelease
      namespace: podinfo
      name: podinfo
  - path: whoami-values.yaml
    target:
      kind: HTTPRoute
      namespace: whoami
      name: whoami
  - path: beszel-values.yaml
    target:
      kind: HTTPRoute
      namespace: beszel
      name: beszel
  - path: homepage-values.yaml
    target:
      kind: HTTPRoute
      namespace: homepage
      name: homepage
  - path: calibre-values.yaml
    target:
      kind: HTTPRoute
      namespace: calibre
      name: calibre
  - path: pocket-id-values.yaml
    target:
      kind: HTTPRoute
      namespace: pocket-id
      name: pocket-id