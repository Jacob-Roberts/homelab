apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 1h
  targetNamespace: kube-system
  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    k8sServiceHost: kind-control-plane
    k8sServicePort: 6443
    kubeProxyReplacement: true
    gatewayAPI:
      enabled: true
    l7Proxy: true
  # Automatically patch the Gateway service to be a NodePort
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: cilium-gateway-my-gateway # Must match your Gateway name
            patch: |
              - op: replace
                path: /spec/type
                value: NodePort
              - op: add
                path: /spec/ports/0/nodePort
                value: 30080