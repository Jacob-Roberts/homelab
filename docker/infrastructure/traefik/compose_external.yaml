# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

---
networks:
  crowdsec-traefik:
    external: false
  internal-external:
    external: false

volumes:
  crowdsec-config:
  crowdsec-db:
  plugins-external:
  certs-storage-external:
  logs-external:

services:
  traefik-internal:
    networks:
      - internal-external
  traefik-external:
    image: docker.io/traefik:v3
    container_name: traefik-external
    command:
      - "--configFile=/traefik/traefik.yaml"
    read_only: true
    user: "${TRAEFIK_SRV_ID:-2001}:${TRAEFIK_GROUP_ID:-2001}"
    security_opt:
      - no-new-privileges:true
    sysctls:
      # allow rootless container to access ports < 1024
      net.ipv4.ip_unprivileged_port_start: 80
    depends_on:
      socket-proxy:
        condition: service_healthy
        restart: true
      chown:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: local
    healthcheck:
      # https://doc.traefik.io/traefik/operations/cli/#healthcheck
      test: [CMD, traefik, healthcheck, "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "${HOST_IP_V4}:80:80/tcp"
      - "${HOST_IP_V4}:443:443/tcp"
      - "${HOST_IP_V4}:443:443/udp"
    environment:
      CF_DNS_API_TOKEN: "${CF_DNS_API_TOKEN}"
      CROWDSEC_TRAEFIK_BOUNCER_TOKEN: "${CROWDSEC_TRAEFIK_BOUNCER_TOKEN}"
      TZ: "${TZ:-UTC}"
      TRAEFIK_URL: "${TRAEFIK_EXTERNAL_URL}"
      NODE_NAME: "${NODE_NAME}-external"
    networks:
      - crowdsec-traefik
      - internal-external
    volumes:
      - ./config/traefik-external.yaml:/traefik/traefik.yaml:ro
      - ./config/conf-external/crowdsec-config.yaml:/traefik/conf/crowdsec-config.yaml:ro
      - ./config/conf-external/geoblock-config.yaml:/traefik/conf/geoblock-config.yaml:ro
      - ./config/conf-external/https.yaml:/traefik/conf/https.yaml:ro
      - ./config/conf-shared/identify-node.yaml:/traefik/conf/identify-node.yaml:ro
      - ./config/conf-shared/ping-https.yaml:/traefik/conf/ping-https.yaml:ro
      - ./config/conf-shared/websecure-redirect.yaml:/traefik/conf/websecure-redirect.yaml:ro
      - ./config/ban.html:/traefik/ban.html:ro
      - ./config/captcha.html:/traefik/captcha.html:ro
      - plugins-external:/plugins-storage/:rw
      - certs-storage-external:/traefik/certs:rw
      - logs-external:/var/log/traefik:rw
      # access docker socket via proxy read-only
      - socket-proxy:/var/run
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    # labels:
    #   # Management only exposed internally
    #   traefik.enable: "true"
    #   traefik.docker.network: traefik_internal
    #   traefik.http.services.traefikexternal-prod-1.loadBalancer.server.port: 8080 # TODO: Expose this securely
    #   traefik.http.routers.traefikexternal-prod-1-http.entrypoints: web
    #   traefik.http.routers.traefikexternal-prod-1-http.rule: "Host(`${TRAEFIK_EXTERNAL_URL}`)  && !PathPrefix(`/ping`)"
    #   traefik.http.routers.traefikexternal-prod-1-http.middlewares: "websecure-redirect-permanent@file"
    #   traefik.http.routers.traefikexternal-prod-1-https.entrypoints: websecure
    #   traefik.http.routers.traefikexternal-prod-1-https.rule: "Host(`${TRAEFIK_EXTERNAL_URL}`)  && !PathPrefix(`/ping`)"
    #   traefik.http.routers.traefikexternal-prod-1-https.tls: "true"
    #   traefik.http.routers.traefikexternal-prod-1-https.tls.certresolver: cloudflare

  crowdsec:
    image: docker.io/crowdsecurity/crowdsec:latest
    container_name: crowdsec
    command: "-t"
    user: "${DOCKER_USER_ID:-2001}:${DOCKER_GROUP_ID:-2001}"
    restart: unless-stopped
    depends_on:
      chown:
        condition: service_completed_successfully
    healthcheck:
      interval: 10s
      retries: 15
      test:
        - CMD
        - cscli
        - capi
        - status
      timeout: 10s
    environment:
      COLLECTIONS: crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      CUSTOM_HOSTNAME: crowdsec
      ENROLL_INSTANCE_NAME: pangolin-crowdsec
      ENROLL_TAGS: docker
      GID: "${DOCKER_GROUP_ID:-2001}"
      UID: "${DOCKER_USER_ID:-2001}"
      PARSERS: crowdsecurity/whitelists
      BOUNCER_KEY_TRAEFIK: "${CROWDSEC_TRAEFIK_BOUNCER_TOKEN}"
    networks:
      - crowdsec-traefik
    volumes:
      - ./config/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
      - logs-external:/var/log/traefik
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      traefik.enable: "false"

  # This image will mount the volume and then simply execute chown on the parent folder for the UID/GID specified.
  chown:
    image: alpine
    command:
      - |
        chown -R ${DOCKER_USER_ID:-2001}:${DOCKER_GROUP_ID:-2001} /var/lib/crowdsec/data
        chown -R ${DOCKER_USER_ID:-2001}:${DOCKER_GROUP_ID:-2001} /etc/crowdsec
        chown -R ${TRAEFIK_SRV_ID:-2001}:${TRAEFIK_GROUP_ID:-2001} /var/log/traefik
        chown -R ${TRAEFIK_SRV_ID:-2001}:${TRAEFIK_GROUP_ID:-2001} /plugins-storage
        chown -R ${TRAEFIK_SRV_ID:-2001}:${TRAEFIK_GROUP_ID:-2001} /traefik/certs
    networks: []
    volumes:
      - crowdsec-config:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec/data
      - logs-external:/var/log/traefik
      - plugins-external:/plugins-storage
      - certs-storage-external:/traefik/certs
    entrypoint: [/bin/ash, "-c"]
    logging:
      driver: local
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
