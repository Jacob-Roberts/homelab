apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  targetNamespace: external-dns
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    provider:
      name: cloudflare
    extraArgs:
      cloudflare-record-comment: managed by k8s external dns
    sources:
      - service
      - ingress
      - gateway-httproute
    policy: upsert-only
    domainFilters:
      - jakerob.pro
    txtOwnerId: jakerob-pro
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
