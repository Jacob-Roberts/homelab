---
- name: Install NetBird
  hosts: netbird
  become: true

  tasks:
    - name: Update apt cache and install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Download NetBird repository signing key
      ansible.builtin.get_url:
        url: https://pkgs.netbird.io/debian/public.key
        dest: /tmp/netbird-public.key
        mode: '0644'

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Install NetBird repository signing key
      ansible.builtin.command:
        cmd: >
          gpg --dearmor
          --yes
          --output /usr/share/keyrings/netbird-archive-keyring.gpg
          /tmp/netbird-public.key
        creates: /usr/share/keyrings/netbird-archive-keyring.gpg

    - name: Configure NetBird apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main"
        filename: netbird
        state: present
        update_cache: true

    - name: Install NetBird
      ansible.builtin.apt:
        name: netbird
        state: present
