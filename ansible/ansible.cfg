# For local runs only (linting, syntax checks): cd ansible && ansible-playbook ...
# Semaphore runs from the repo root, so it never reads this file. Nothing
# here may be required for a playbook to work.
[defaults]
inventory = inventory/hosts.yaml
roles_path = roles
collections_path = collections
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
