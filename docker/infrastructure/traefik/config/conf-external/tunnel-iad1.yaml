# Public edge routes on iad1 for services that live elsewhere.
#
# Every hostname here is a top-level *.jakerob.pro (or another public zone)
# name whose public DNS points at iad1-node-1. Site hostnames
# (*.pbj / *.iad1 / *.slc1.jakerob.pro) are VPN-only and must never be routed
# by a traefik-external instance.
#
# Each tunnel lands on the remote site's traefik-internal (its Netbird IP),
# which hands the request to that site's traefik-external
# (see conf-internal/tunnel-<site>.yaml).
http:
  # The remote traefik-internal has no certificate for its <node>.vpn name, so
  # it answers this hop with TRAEFIK DEFAULT CERT and verification fails (500).
  # The hop runs inside Netbird's WireGuard tunnel, which already encrypts and
  # authenticates the peer, so skip verification here (same reasoning as the
  # plain-HTTP k8s-gateway hop below).
  serversTransports:
    netbird-tunnel:
      insecureSkipVerify: true

  services:
    pbj-tunnel:
      loadBalancer:
        serversTransport: netbird-tunnel
        servers:
          - url: https://pbj-node-1.vpn.jakerob.pro

    slc1-tunnel:
      loadBalancer:
        serversTransport: netbird-tunnel
        servers:
          - url: https://slc1-node-3.vpn.jakerob.pro

    # Kubernetes Gateway (shared), reached over Netbird as plain HTTP. The
    # WireGuard tunnel supplies transport encryption and peer authentication;
    # the hop itself carries no TLS. Cilium routes plain HTTP by Host header
    # (its HTTPS listeners are selected by SNI, which HTTP does not carry).
    k8s-gateway:
      loadBalancer:
        servers:
          - url: http://192.168.42.200

  routers:
    # WHOAMI pbj (public test endpoint)
    whoami-pbj-http:
      entrypoints: web
      rule: "Host(`whoami-external-pbj.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    whoami-pbj-https:
      entrypoints: websecure
      rule: "Host(`whoami-external-pbj.jakerob.pro`)"
      service: pbj-tunnel
      tls:
        certResolver: letsencrypt

    immich-pbj-http:
      entrypoints: web
      rule: "Host(`photos.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    immich-pbj-https:
      entrypoints: websecure
      rule: "Host(`photos.jakerob.pro`)"
      service: pbj-tunnel
      tls:
        certResolver: letsencrypt

    jellyfin-pbj-http:
      entrypoints: web
      rule: "Host(`jellyfin.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    jellyfin-pbj-https:
      entrypoints: websecure
      rule: "Host(`jellyfin.jakerob.pro`)"
      service: pbj-tunnel
      tls:
        certResolver: letsencrypt

    karakeep-pbj-http:
      entrypoints: web
      rule: "Host(`karakeep.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    karakeep-pbj-https:
      entrypoints: websecure
      rule: "Host(`karakeep.jakerob.pro`)"
      service: pbj-tunnel
      tls:
        certResolver: letsencrypt

    calibre-pbj-http:
      entrypoints: web
      rule: "Host(`calibre.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: pbj-tunnel
    calibre-pbj-https:
      entrypoints: websecure
      rule: "Host(`calibre.jakerob.pro`)"
      service: pbj-tunnel
      tls:
        certResolver: letsencrypt

    # Kubernetes apps published through iad1. The certificate is minted here
    # with HTTP-01 (the public hostname points at iad1). The route stays on
    # my-gateway so the local split-horizon path keeps working unchanged.
    auth-jakerob-http:
      entrypoints: web
      rule: "Host(`auth.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: k8s-gateway
    auth-jakerob-https:
      entrypoints: websecure
      rule: "Host(`auth.jakerob.pro`)"
      service: k8s-gateway
      tls:
        certResolver: letsencrypt

    # WHOAMI slc1 (public test endpoint)
    whoami-slc1-http:
      entrypoints: web
      rule: "Host(`whoami-external-slc1.jakerob.pro`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    whoami-slc1-https:
      entrypoints: websecure
      rule: "Host(`whoami-external-slc1.jakerob.pro`)"
      service: slc1-tunnel
      tls:
        certResolver: letsencrypt

    pocket-id-slc1-http:
      entrypoints: web
      rule: "Host(`auth.autovation.com`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    pocket-id-slc1-https:
      entrypoints: websecure
      rule: "Host(`auth.autovation.com`)"
      service: slc1-tunnel
      tls:
        certResolver: letsencrypt

    jellyfin-slc1-http:
      entrypoints: web
      rule: "Host(`jellyfin.autovation.com`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    jellyfin-slc1-https:
      entrypoints: websecure
      rule: "Host(`jellyfin.autovation.com`)"
      service: slc1-tunnel
      tls:
        certResolver: letsencrypt

    photos-slc1-http:
      entrypoints: web
      rule: "Host(`photos.autovation.com`)"
      middlewares:
        - websecure-redirect-permanent@file
      service: slc1-tunnel
    photos-slc1-https:
      entrypoints: websecure
      rule: "Host(`photos.autovation.com`)"
      service: slc1-tunnel
      tls:
        certResolver: letsencrypt
