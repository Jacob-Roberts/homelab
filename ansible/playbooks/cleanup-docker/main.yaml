---
# Run: ansible-playbook playbooks/cleanup-docker/main.yaml
# (path kept stable for scheduled Semaphore runs)
#
# Frees space without touching anything doco-cd manages: stopped containers
# that belong to a Compose project (one-shot init containers such as the
# chown-* services, stacks stopped on purpose) are left alone.
- name: Clean up Docker disk usage
  hosts: docker
  become: true

  tasks:
    - name: Prune stopped containers not owned by a Compose project
      community.docker.docker_prune:
        containers: true
        containers_filters:
          "label!": com.docker.compose.project

    - name: Prune dangling images and build cache
      community.docker.docker_prune:
        images: true
        builder_cache: true
