apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical-secrets-operator
  namespace: infisical
spec:
  interval: 1h
  targetNamespace: infisical
  chart:
    spec:
      chart: secrets-operator
      version: 0.x
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  values:
    # Cluster-wide install and v1beta1 CRDs are the default operator mode.
    installCRDs: true
