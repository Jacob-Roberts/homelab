# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json

networks:
  webnut:
    external: true
    name: webnut_frontend
  immich:
    external: true
    name: immich_frontend
  jellyfin:
    external: true
    name: jellyfin_frontend
  pocket-id:
    external: true
    name: pocket-id_frontend
  syncthing:
    external: true
    name: syncthing_frontend
  whoami:
    external: true
    name: whoami_frontend
  whoami-external:
    external: true
    name: whoami_frontend-external

services:
  # *.slc1.jakerob.pro, VPN only
  traefik-internal:
    networks:
      - whoami
      - webnut
      - jellyfin
      - syncthing

  # Public hostnames, reached through iad1 -> Netbird -> traefik-internal
  traefik-external:
    networks:
      - whoami-external
      - immich
      - pocket-id
