apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: webnut-secrets
  namespace: webnut
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        # Same path the docker compose stack on pbj-node-1 used. Expected keys:
        # UPS_ADDR, UPS_USER, UPS_PASSWORD.
        projectId: f3732b81-3a85-430d-a547-43b85c363ad6
        envSlug: prod
        secretsPath: /pbj/webnut
        recursive: true
  managedSecretReference:
    secretName: webnut-secrets
    secretNamespace: webnut
    creationPolicy: Owner
