---
# calibre-web-automated bundles Calibre plus the auto-ingest watcher and serves
# the web UI on 8083. Single replica on a single writer, so use the Recreate
# strategy rather than briefly running two pods against the same SQLite config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre
  namespace: calibre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: calibre
          image: docker.io/crocodilestick/calibre-web-automated:v4.0.8
          ports:
            - name: http
              containerPort: 8083
          env:
            # The image starts as root, then drops to this uid/gid. On the NFS
            # volumes all client uids are squashed to root server-side anyway,
            # so these values just need to match the ownership model below.
            - name: PUID
              value: "2006"
            - name: PGID
              value: "2006"
            - name: TZ
              value: Etc/UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                # Minimal set the s6 init needs to chown /run and the data dirs
                # and to drop privileges to PUID/PGID. No NET_*/SYS_ADMIN here.
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
                - SETGID
                - SETPCAP
                - SETUID
          # Calibre-Web takes ~40s to bind after the container starts; without a
          # startup probe the Service would route traffic to a pod that is not
          # serving yet (and the 500-then-recover window looks like an outage).
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: run
              mountPath: /run
            - name: config
              mountPath: /config
            - name: ingest
              mountPath: /cwa-book-ingest
            - name: library
              mountPath: /calibre-library
      volumes:
        - name: run
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: calibre-config
        - name: ingest
          persistentVolumeClaim:
            claimName: calibre-ingest
        - name: library
          persistentVolumeClaim:
            claimName: calibre-library
---
apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: calibre
spec:
  selector:
    app: calibre
  ports:
    - name: http
      port: 80
      targetPort: 8083
