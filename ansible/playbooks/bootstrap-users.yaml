---
# =============================================================================
# Admin users (first run on a new host)
# =============================================================================
# Run once per new host, connecting as whatever user the image ships with
# (Semaphore: limit to the host, extra variables {"ansible_user": "ubuntu"}).
# That user must already accept Semaphore's key (cloud-init / authorized_keys).
#
# Creates every account in admin_users (group_vars/all.yaml), adds its
# ssh_keys and grants passwordless sudo. Existing keys are kept. After this,
# every other playbook connects as ansible-robot.
# Safe to re-run, e.g. after adding an admin or rotating a key.
# =============================================================================

- name: Admin users
  hosts: hardened
  become: true

  tasks:
    - name: Ensure every admin has a public key
      ansible.builtin.assert:
        that: item.ssh_keys | default([]) | length > 0
        fail_msg: "Add {{ item.name }}'s public key(s) to admin_users in inventory/group_vars/all.yaml"
        quiet: true
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create admin users
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        groups: sudo
        append: true
        create_home: true
        state: present
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install admin SSH keys
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_keys | join('\n') }}"
        state: present
      loop: "{{ admin_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Grant admins passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/admins
        content: |
          # Managed by ansible (playbooks/bootstrap-users.yaml)
          {% for user in admin_users %}
          {{ user.name }} ALL=(ALL) NOPASSWD:ALL
          {% endfor %}
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Next step
      ansible.builtin.debug:
        msg: >-
          Admin users are ready. Run playbooks/site.yaml for
          {{ inventory_hostname }} next, without the ansible_user override.
