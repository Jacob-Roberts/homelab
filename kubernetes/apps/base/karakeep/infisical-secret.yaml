apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: karakeep-secrets
  namespace: karakeep
spec:
  syncConfig:
    resyncInterval: 1m
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        # Same path the docker compose stack on lhr1-node-1 used
        # (get-env-file.sh). Expected keys: NEXTAUTH_SECRET, MEILI_MASTER_KEY,
        # OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, OAUTH_PROVIDER_NAME.
        # The web container takes the whole Secret via envFrom; meilisearch
        # only reads MEILI_MASTER_KEY.
        projectId: f3732b81-3a85-430d-a547-43b85c363ad6
        envSlug: prod
        secretsPath: /pbj/karakeep
        recursive: true
  managedSecretReference:
    secretName: karakeep-secrets
    secretNamespace: karakeep
    creationPolicy: Owner
