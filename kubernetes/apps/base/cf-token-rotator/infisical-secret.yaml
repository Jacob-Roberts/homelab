# The rotator's own Infisical machine identity (universal auth). It is a
# separate identity from the operator's because it needs WRITE access to the
# token paths in config.yaml, which the operator identity should not have.
# Expected keys at prod:/global/cf-token-rotator/identity:
#   INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: cf-token-rotator-identity
  namespace: cf-token-rotator
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: infisical
  syncOptions:
    refreshInterval: 1h
  sources:
    - projectId: f3732b81-3a85-430d-a547-43b85c363ad6
      environmentSlug: prod
      secretPath: /global/cf-token-rotator/identity
  targets:
    - name: cf-token-rotator-identity
      namespace: cf-token-rotator
      kind: Secret
      creationPolicy: Owner
      template:
        engineVersion: v1
        data:
          INFISICAL_CLIENT_ID: "{{ .INFISICAL_CLIENT_ID.Value }}"
          INFISICAL_CLIENT_SECRET: "{{ .INFISICAL_CLIENT_SECRET.Value }}"
